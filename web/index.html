    <title>哄我上班 😽</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            width: 100%;
            min-height: 100%;
            background: var(--bg-gradient);
            background-color: var(--bg, #101422);
            overflow: hidden;
            overscroll-behavior: none;
        }

        :root {
            --bg: #101422;
            --bg-gradient: linear-gradient(140deg, #101422 0%, #221947 34%, #0c3b45 68%, #121928 100%);
            --decor: linear-gradient(120deg, transparent 0 21%, rgba(117,240,207,0.12) 21% 22%, transparent 22% 52%, rgba(255,122,182,0.11) 52% 53%, transparent 53% 100%);
            --decor-size: 220px 220px;
            --decor-opacity: 1;
            --card: rgba(255,255,255,0.09);
            --card-border: rgba(214,232,255,0.18);
            --text: #f7fbff;
            --text-muted: #b8c7d9;
            --primary: #75f0cf;
            --primary-light: #b990ff;
            --accent: #ff7ab6;
            --on-primary: #061b18;
            --shadow: rgba(25,240,203,0.16);
            --clock-shadow: 0 0 26px rgba(117,240,207,0.32), 0 0 70px rgba(185,144,255,0.16);
            --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            --radius: 8px;
            --radius-sm: 6px;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-gradient);
            background-color: var(--bg);
            color: var(--text);
            width: 100%;
            height: 100%;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            min-height: 100dvh;
            min-height: 100lvh;
            transition: background 0.5s ease;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y;
            position: relative;
        }
        body::before {
            content: ''; position: fixed;
            inset: calc(-80px - env(safe-area-inset-top, 0px)) calc(-80px - env(safe-area-inset-right, 0px)) calc(-80px - env(safe-area-inset-bottom, 0px)) calc(-80px - env(safe-area-inset-left, 0px));
            z-index: 0; pointer-events: none;
            background: var(--bg-gradient);
            background-color: var(--bg);
        }

        /* ========== 主题 ========== */
        html.theme-cyber,
        body.theme-cyber {
            --bg: #030507;
            --bg-gradient: linear-gradient(90deg, rgba(0,255,157,0.07) 1px, transparent 1px), linear-gradient(180deg, #030507 0%, #08110f 52%, #120617 100%);
            --decor: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 5px);
            --decor-size: auto;
            --decor-opacity: 0.7;
            --card: rgba(0,255,157,0.08);
            --card-border: rgba(0,255,157,0.30);
            --text: #effff8;
            --text-muted: #7df7c6;
            --primary: #00ff9d;
            --primary-light: #ff2bd6;
            --accent: #f8f871;
            --on-primary: #001b11;
            --shadow: rgba(0,255,157,0.18);
            --clock-shadow: 0 0 20px rgba(0,255,157,0.48), 0 0 56px rgba(255,43,214,0.20);
            --font-display: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', 'Courier New', monospace;
            --font-body: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', 'Courier New', monospace;
            --radius: 4px;
            --radius-sm: 4px;
        }
        html.theme-warm,
        body.theme-warm {
            --bg: #fff7fb;
            --bg-gradient: linear-gradient(135deg, #fff7fb 0%, #ffe4ef 38%, #d8fff3 100%);
            --decor: linear-gradient(135deg, rgba(225,29,72,0.10) 0 25%, transparent 25% 50%, rgba(20,184,166,0.10) 50% 75%, transparent 75%);
            --decor-size: 34px 34px;
            --decor-opacity: 1;
            --card: rgba(255,255,255,0.72);
            --card-border: rgba(225,29,72,0.20);
            --text: #2a1719;
            --text-muted: #7c4a56;
            --primary: #e11d48;
            --primary-light: #14b8a6;
            --accent: #f59e0b;
            --on-primary: #ffffff;
            --shadow: rgba(225,29,72,0.14);
            --clock-shadow: 0 8px 0 rgba(20,184,166,0.14);
            --font-display: 'Avenir Next', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            --font-body: 'Avenir Next', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }
        html.theme-ocean,
        body.theme-ocean {
            --bg: #061923;
            --bg-gradient: linear-gradient(180deg, #061923 0%, #083344 44%, #062d35 100%);
            --decor: repeating-radial-gradient(circle at 50% 52%, transparent 0 56px, rgba(54,226,255,0.12) 57px 58px, transparent 59px 116px);
            --decor-size: auto;
            --decor-opacity: 1;
            --card: rgba(7,89,133,0.20);
            --card-border: rgba(103,232,249,0.25);
            --text: #ecfeff;
            --text-muted: #8dd9e8;
            --primary: #36e2ff;
            --primary-light: #a3e635;
            --accent: #f0abfc;
            --on-primary: #001b26;
            --shadow: rgba(54,226,255,0.14);
            --clock-shadow: 0 0 22px rgba(54,226,255,0.36), 0 0 64px rgba(163,230,53,0.12);
            --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        }
        html.theme-mono,
        body.theme-mono {
            --bg: #f7f7f2;
            --bg-gradient: linear-gradient(180deg, #f7f7f2 0%, #e7e5dc 100%);
            --decor: repeating-linear-gradient(90deg, rgba(0,0,0,0.045) 0 1px, transparent 1px 16px);
            --decor-size: auto;
            --decor-opacity: 1;
            --card: rgba(255,255,255,0.86);
            --card-border: rgba(17,17,17,0.28);
            --text: #111111;
            --text-muted: #565656;
            --primary: #111111;
            --primary-light: #111111;
            --accent: #e11d48;
            --on-primary: #ffffff;
            --shadow: rgba(17,17,17,0.13);
            --clock-shadow: none;
            --font-display: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif;
            --font-body: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif;
            --radius: 2px;
            --radius-sm: 2px;
        }
        html.theme-forest,
        body.theme-forest {
            --bg: #eafff6;
            --bg-gradient: linear-gradient(160deg, #eafff6 0%, #b7f4dc 42%, #173f35 100%);
            --decor: linear-gradient(45deg, transparent 0 47%, rgba(15,118,110,0.08) 47% 48%, transparent 48% 100%);
            --decor-size: 120px 120px;
            --decor-opacity: 1;
            --card: rgba(247,255,250,0.76);
            --card-border: rgba(23,63,53,0.18);
            --text: #0f2f28;
            --text-muted: #4f766d;
            --primary: #0f766e;
            --primary-light: #f59e0b;
            --accent: #0ea5e9;
            --on-primary: #f8fffb;
            --shadow: rgba(15,118,110,0.13);
            --clock-shadow: 0 10px 24px rgba(15,118,110,0.18);
            --font-display: 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', serif;
            --font-body: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }
        html.theme-ledger,
        body.theme-ledger {
            --bg: #080a0d;
            --bg-gradient: linear-gradient(135deg, #080a0d 0%, #15181e 55%, #071611 100%);
            --decor: repeating-linear-gradient(90deg, rgba(250,204,21,0.10) 0 1px, transparent 1px 88px), repeating-linear-gradient(0deg, rgba(255,255,255,0.045) 0 1px, transparent 1px 44px);
            --decor-size: auto;
            --decor-opacity: 1;
            --card: rgba(255,255,255,0.07);
            --card-border: rgba(234,179,8,0.26);
            --text: #f8fafc;
            --text-muted: #a9b4c2;
            --primary: #facc15;
            --primary-light: #22c55e;
            --accent: #38bdf8;
            --on-primary: #111827;
            --shadow: rgba(250,204,21,0.13);
            --clock-shadow: 0 0 22px rgba(250,204,21,0.26);
            --font-display: Georgia, 'Times New Roman', 'Songti SC', serif;
            --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        }
        html.theme-arcade,
        body.theme-arcade {
            --bg: #121019;
            --bg-gradient: linear-gradient(135deg, #121019 0%, #30115e 38%, #042f2e 100%);
            --decor: linear-gradient(90deg, rgba(255,255,255,0.055) 1px, transparent 1px), linear-gradient(rgba(255,255,255,0.055) 1px, transparent 1px);
            --decor-size: 24px 24px;
            --decor-opacity: 1;
            --card: rgba(9,8,28,0.74);
            --card-border: rgba(251,191,36,0.34);
            --text: #fff7ed;
            --text-muted: #f0abfc;
            --primary: #f59e0b;
            --primary-light: #22d3ee;
            --accent: #fb7185;
            --on-primary: #1f1300;
            --shadow: rgba(245,158,11,0.20);
            --clock-shadow: 4px 4px 0 rgba(34,211,238,0.38), 8px 8px 0 rgba(251,113,133,0.28);
            --font-display: 'Courier New', 'SF Mono', Monaco, monospace;
            --font-body: 'Courier New', 'SF Mono', Monaco, monospace;
            --radius: 0;
            --radius-sm: 0;
        }

        /* ========== 布局 ========== */
        .hidden { display: none !important; }
        #clockView {
            width: 100%; height: 100vh; height: -webkit-fill-available; height: var(--app-height); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative; padding: 24px;
            padding-top: max(24px, env(safe-area-inset-top));
            padding-bottom: 24px;
            overflow: hidden; overscroll-behavior: none; isolation: isolate; z-index: 2;
        }

        /* ========== 时钟页 ========== */
        .clock-display { text-align: center; position: relative; z-index: 2; }
        .clock-display::after {
            content: ''; position: absolute; inset: -42px -56px; z-index: -1; pointer-events: none;
            border-radius: 999px;
            background:
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.16), transparent 28%),
                radial-gradient(circle at 35% 60%, var(--primary), transparent 36%),
                radial-gradient(circle at 70% 40%, var(--accent), transparent 34%);
            filter: blur(30px); opacity: 0.18;
            animation: clockHaloPulse 4.8s ease-in-out infinite;
        }
        .clock-label { font-size: 1rem; color: var(--text-muted); margin-bottom: 16px; letter-spacing: 0; text-transform: uppercase; }
        .clock-amount {
            font-family: var(--font-display); font-size: 5rem; font-weight: 800; line-height: 1;
            font-feature-settings: "tnum"; font-variant-numeric: tabular-nums;
            color: var(--text); transition: text-shadow 0.1s; text-shadow: var(--clock-shadow);
            white-space: nowrap;
        }

        .clock-sub {
            margin-top: 24px; font-size: 0.85rem; color: var(--text-muted);
            display: flex; gap: 24px; justify-content: center; flex-wrap: wrap;
        }
        .clock-sub span { font-variant-numeric: tabular-nums; }

        .clock-effects {
            position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; opacity: 0.95;
        }
        .clock-effects::before,
        .clock-effects::after,
        .clock-effects .effect {
            content: ''; position: absolute; display: block;
        }
        .clock-effects .effect { opacity: 0; }

        /* 倒计时 */
        .countdown-box { text-align: center; position: relative; z-index: 2; margin-top: 20px; animation: fadeIn 0.5s ease; }
        .countdown-label { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0; }
        .countdown-time { font-family: var(--font-display); font-size: 2.8rem; font-weight: 800; color: var(--primary); line-height: 1.1; font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; white-space: nowrap; text-shadow: var(--clock-shadow); }
        .countdown-quote { font-size: 0.9rem; color: var(--text-muted); margin-top: 14px; font-style: italic; opacity: 0.85; max-width: 320px; margin-left: auto; margin-right: auto; line-height: 1.5; }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed; inset: -80px; pointer-events: none; z-index: 1; overflow: hidden;
            background: var(--decor); background-size: var(--decor-size); opacity: var(--decor-opacity);
            transform: translateZ(0);
        }
        .bg-decoration::before,
        .bg-decoration::after {
            content: ''; position: absolute; pointer-events: none;
        }
        body.theme-aurora .bg-decoration { animation: auroraDecorDrift 18s ease-in-out infinite alternate; }
        body.theme-aurora .bg-decoration::before {
            inset: -12% -18%; opacity: 0.55;
            background: linear-gradient(118deg, transparent 12%, rgba(117,240,207,0.18) 30%, transparent 47%, rgba(255,122,182,0.16) 66%, transparent 84%);
            filter: blur(16px); transform: skewY(-8deg); animation: auroraBgSweep 13s ease-in-out infinite alternate;
        }
        body.theme-cyber .bg-decoration { animation: cyberGridDrift 7s linear infinite; }
        body.theme-cyber .bg-decoration::before {
            inset: 0; opacity: 0.34;
            background: repeating-linear-gradient(0deg, transparent 0 8px, rgba(0,255,157,0.16) 9px, transparent 10px);
            animation: scanlines 1.45s linear infinite;
        }
        body.theme-cyber .bg-decoration::after {
            top: -10%; bottom: -10%; width: 18%; left: -26%; opacity: 0.42;
            background: linear-gradient(90deg, transparent, rgba(0,255,157,0.20), rgba(255,43,214,0.18), transparent);
            filter: blur(8px); transform: skewX(-18deg); animation: cyberSweepWide 6.5s linear infinite;
        }
        body.theme-warm .bg-decoration { animation: warmPatternDrift 12s linear infinite; }
        body.theme-warm .bg-decoration::before {
            inset: -16%; opacity: 0.38;
            background: repeating-linear-gradient(135deg, rgba(225,29,72,0.12) 0 14px, transparent 14px 34px, rgba(20,184,166,0.11) 34px 48px, transparent 48px 70px);
            animation: warmRibbon 16s linear infinite;
        }
        body.theme-ocean .bg-decoration { animation: oceanCurrent 14s ease-in-out infinite alternate; }
        body.theme-ocean .bg-decoration::before {
            width: 120vmax; height: 120vmax; left: 50%; top: 50%; opacity: 0.36; border-radius: 50%;
            background: repeating-radial-gradient(circle, transparent 0 72px, rgba(103,232,249,0.18) 73px 75px, transparent 76px 144px);
            transform: translate(-50%,-50%) scale(0.92); animation: oceanRippleBg 10s ease-out infinite;
        }
        body.theme-mono .bg-decoration { animation: monoPaperShift 9s ease-in-out infinite alternate; }
        body.theme-mono .bg-decoration::before {
            inset: 8% 12%; opacity: 0.46;
            background: linear-gradient(90deg, transparent 0 48%, rgba(17,17,17,0.22) 48% 52%, transparent 52% 100%);
            animation: editorialSlide 10s ease-in-out infinite alternate;
        }
        body.theme-forest .bg-decoration { animation: forestBreath 12s ease-in-out infinite alternate; }
        body.theme-forest .bg-decoration::before {
            inset: -18% auto -18% 4%; width: 24%; opacity: 0.52;
            background: linear-gradient(90deg, transparent, rgba(234,255,246,0.45), transparent);
            filter: blur(14px); transform: skewX(-16deg); animation: forestLightSweep 9s ease-in-out infinite alternate;
        }
        body.theme-forest .bg-decoration::after {
            left: 8%; right: 8%; top: 30%; height: 1px; opacity: 0.42;
            background: linear-gradient(90deg, transparent, rgba(15,118,110,0.34), transparent);
            box-shadow: 18vw 22vh 0 rgba(15,118,110,0.20), -10vw 40vh 0 rgba(255,255,255,0.18);
            animation: mistLine 8s ease-in-out infinite;
        }
        body.theme-ledger .bg-decoration { animation: ledgerBgScroll 13s linear infinite; }
        body.theme-ledger .bg-decoration::before {
            content: '\00a5 + + \00a5 + + \00a5 + + \00a5 + + \00a5 + + \00a5 + +'; left: 0; right: 0; top: 18%; opacity: 0.16;
            font-family: var(--font-display); font-size: 1rem; color: var(--primary); white-space: nowrap;
            animation: tickerTape 22s linear infinite;
        }
        body.theme-arcade .bg-decoration { animation: arcadeGridStep 4.5s steps(8,end) infinite; }
        body.theme-arcade .bg-decoration::before {
            inset: 0; opacity: 0.38; image-rendering: pixelated;
            background: linear-gradient(90deg, rgba(245,158,11,0.72) 8px, transparent 8px), linear-gradient(90deg, rgba(34,211,238,0.64) 8px, transparent 8px), linear-gradient(90deg, rgba(251,113,133,0.62) 8px, transparent 8px);
            background-size: 120px 8px, 150px 8px, 180px 8px;
            background-position: 10% 18%, 74% 46%, 22% 76%;
            background-repeat: repeat-x; animation: pixelRails 5.2s steps(10,end) infinite;
        }

        /* ========== 主题人格化：时钟效果 ========== */
        body.theme-aurora #clockView .clock-effects::before {
            inset: 8% -18%; opacity: 0.78;
            background: linear-gradient(115deg, transparent 5%, rgba(117,240,207,0.26) 25%, transparent 42%, rgba(255,122,182,0.23) 62%, transparent 86%);
            filter: blur(18px); transform: skewY(-10deg); animation: auroraSweep 10s ease-in-out infinite alternate;
        }
        body.theme-aurora #clockView .effect-a {
            inset: auto 12% 18% 12%; height: 2px; opacity: 0.95;
            background: linear-gradient(90deg, transparent, rgba(117,240,207,0.85), rgba(255,122,182,0.75), transparent);
            animation: horizonGlow 4.5s ease-in-out infinite;
        }
        body.theme-aurora #clockView .effect-b {
            width: 180px; height: 180px; right: 12%; top: 18%; opacity: 0.52; border-radius: 50%;
            border: 1px solid rgba(117,240,207,0.48); box-shadow: 0 0 40px rgba(185,144,255,0.22);
            animation: orbitDrift 9s ease-in-out infinite alternate;
        }
        body.theme-aurora .clock-display::before {
            content: ''; position: absolute; inset: -22px -28px; border: 1px solid rgba(117,240,207,0.22);
            transform: skewY(-2deg); z-index: -1; box-shadow: 0 0 40px rgba(185,144,255,0.14);
        }

        body.theme-cyber #clockView .clock-effects::before {
            inset: 0; opacity: 0.42;
            background: repeating-linear-gradient(0deg, transparent 0 8px, rgba(0,255,157,0.16) 9px, transparent 10px);
            animation: scanlines 1.6s linear infinite;
        }
        body.theme-cyber #clockView .clock-effects::after {
            top: -20%; bottom: -20%; width: 24%; left: -32%; opacity: 0.58;
            background: linear-gradient(90deg, transparent, rgba(0,255,157,0.22), rgba(255,43,214,0.20), transparent);
            filter: blur(10px); transform: skewX(-18deg); animation: neonSweep 5.5s linear infinite;
        }
        body.theme-cyber #clockView .effect-a {
            inset: 14% 18% auto 18%; height: 1px; opacity: 0.88;
            background: linear-gradient(90deg, transparent, rgba(0,255,157,0.9), transparent);
            box-shadow: 0 76px 0 rgba(255,43,214,0.34), 0 152px 0 rgba(248,248,113,0.25);
            animation: terminalBars 2.8s steps(4,end) infinite;
        }
        body.theme-cyber .clock-amount { animation: terminalPulse 2.2s steps(2,end) infinite; }
        body.theme-cyber .clock-label::before { content: 'SYS / '; color: var(--primary); }

        body.theme-warm .clock-amount { color: #e11d48; }
        body.theme-warm #clockView .effect-a {
            inset: 10% 8% auto 8%; height: 36%; opacity: 0.72;
            background: repeating-linear-gradient(135deg, rgba(225,29,72,0.16) 0 12px, transparent 12px 28px, rgba(20,184,166,0.14) 28px 40px, transparent 40px 58px);
            transform: rotate(-2deg); animation: sodaStripes 9s linear infinite;
        }
        body.theme-warm #clockView .effect-b {
            left: 10%; right: 10%; bottom: 14%; height: 2px; opacity: 0.65;
            background: linear-gradient(90deg, transparent, rgba(225,29,72,0.72), rgba(20,184,166,0.62), transparent);
            animation: horizonGlow 3.8s ease-in-out infinite;
        }

        body.theme-ocean .clock-display,
        body.theme-ocean .countdown-box { padding: 26px; border: 1px solid rgba(103,232,249,0.18); border-radius: 50%; }
        body.theme-ocean #clockView .effect-a,
        body.theme-ocean #clockView .effect-b,
        body.theme-ocean #clockView .effect-c {
            width: 280px; height: 280px; left: 50%; top: 50%; border-radius: 50%;
            border: 2px solid rgba(103,232,249,0.46); opacity: 0; transform: translate(-50%,-50%) scale(0.2);
            animation: sonarPing 5.4s ease-out infinite;
        }
        body.theme-ocean #clockView .effect-b { animation-delay: 1.8s; border-color: rgba(163,230,53,0.25); }
        body.theme-ocean #clockView .effect-c { animation-delay: 3.6s; border-color: rgba(240,171,252,0.22); }

        body.theme-mono #clockView .clock-effects::before {
            inset: 11% 12%; opacity: 0.72;
            background: linear-gradient(90deg, transparent 0 49%, rgba(17,17,17,0.30) 49% 51%, transparent 51% 100%);
            animation: editorialSlide 8s ease-in-out infinite alternate;
        }
        body.theme-mono #clockView .effect-a {
            left: 8%; right: 8%; top: 22%; height: 1px; opacity: 0.62; background: #111111;
            animation: printRule 5s ease-in-out infinite;
        }

        body.theme-forest .clock-amount { font-weight: 700; }
        body.theme-forest #clockView .clock-effects::before {
            inset: -20% auto -20% 14%; width: 22%; opacity: 0.62;
            background: linear-gradient(90deg, transparent, rgba(234,255,246,0.42), transparent);
            filter: blur(12px); transform: skewX(-16deg); animation: lightShaft 8s ease-in-out infinite alternate;
        }
        body.theme-forest #clockView .effect-a,
        body.theme-forest #clockView .effect-b {
            width: 40%; height: 1px; opacity: 0.5;
            background: linear-gradient(90deg, transparent, rgba(15,118,110,0.42), transparent);

<body class="theme-aurora">
    <div class="bg-decoration"></div>

    <!-- 时钟页 -->
    <div id="clockView">
        <div class="clock-effects" aria-hidden="true">
            <div class="effect effect-a"></div>
            <div class="effect effect-b"></div>
            <div class="effect effect-c"></div>
        </div>
        <div class="clock-display">
            <div class="clock-label">本月已赚</div>
            <div class="clock-amount" id="clockAmount">¥0.0000</div>
            <div class="clock-sub">
                <span>日薪 <b id="clockDaily">-</b></span>
                <span>时薪 <b id="clockHourly">-</b></span>
                <span><span id="clockLeftLabel">剩余工作日</span> <b id="clockLeft">-</b></span>
            </div>
        </div>
        <!-- 倒计时 + 激励语（非工作时段显示） -->
        <div class="countdown-box hidden" id="countdownBox">
            <div class="countdown-label">⏰ 距离上班还有</div>
            <div class="countdown-time" id="countdownTime">--天 --:--:--</div>
            <div class="countdown-quote" id="countdownQuote">...</div>
        </div>
    </div>

    <script>
        // ==================== VS Code API ====================
        var vscodeApi;
        try {
            vscodeApi = acquireVsCodeApi();
        } catch (e) {
            vscodeApi = null;
        }

        // ==================== 配置（默认值，会被 postMessage 覆盖）====================
        let config = {
            monthlySalary: 20000,
            startTime: '09:00',
            endTime: '18:00',
            lunchDurationMin: 60,
            lunchStart: '12:00',
            mode: 'work',
            theme: 'aurora',
            holidays: {},
            workdays: {},
            decimalPlaces: 4
        };

        // ==================== 主题配置 ====================
        const THEME_OPTIONS = [
            { key: 'aurora', name: '极光舞台' },
            { key: 'cyber', name: '霓虹终端' },
            { key: 'warm', name: '樱桃汽水' },
            { key: 'ocean', name: '深海声呐' },
            { key: 'mono', name: '黑白杂志' },
            { key: 'forest', name: '松林晨雾' },
            { key: 'ledger', name: '黑金账本' },
            { key: 'arcade', name: '像素街机' }
        ];
        const DEFAULT_THEME = 'aurora';
        function normalizeTheme(theme) { return THEME_OPTIONS.some(function (t) { return t.key === theme; }) ? theme : DEFAULT_THEME; }

        function applyTheme() {
            config.theme = normalizeTheme(config.theme);
            var themeClass = 'theme-' + config.theme;
            document.documentElement.className = themeClass;
            document.body.className = themeClass;
            var bg = getComputedStyle(document.body).getPropertyValue('--bg').trim() || '#101422';
            document.documentElement.style.backgroundColor = bg;
            var themeColor = document.querySelector('meta[name="theme-color"]');
            if (themeColor) themeColor.setAttribute('content', bg);
        }

        // ==================== 工具函数 ====================
        function formatDate(d) {
            var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + day;
        }
        // dp 取值规则：参数 > config.decimalPlaces > 4（兜底）；clamp 到 [0, 6]
        function resolveDp(dp) {
            var v = (dp !== undefined && dp !== null) ? dp : config.decimalPlaces;
            if (v === undefined || v === null || !isFinite(v)) v = 4;
            if (v < 0) v = 0;
            if (v > 6) v = 6;
            return v | 0;
        }
        function formatMoney(n, dp) {
            return '¥' + n.toLocaleString('zh-CN', { minimumFractionDigits: resolveDp(dp), maximumFractionDigits: resolveDp(dp) });
        }
        // 副指标用 2 位小数（金额较大，多位无意义；保留可显式覆盖）
        function formatMoneyShort(n, dp) {
            return '¥' + n.toLocaleString('zh-CN', { minimumFractionDigits: resolveDp(dp !== undefined ? dp : 2), maximumFractionDigits: resolveDp(dp !== undefined ? dp : 2) });
        }
        function parseTime(ts) { var parts = ts.split(':'); return parseInt(parts[0]) * 60 + parseInt(parts[1]); }
        // 安全 parseTime：非法输入返回 null
        function parseTimeSafe(ts) {
            if (typeof ts !== 'string') return null;
            var parts = ts.split(':');
            if (parts.length !== 2) return null;
            var h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
            if (!isFinite(h) || !isFinite(m)) return null;
            if (h < 0 || h > 23 || m < 0 || m > 59) return null;
            return h * 60 + m;
        }

        // ==================== 工作日判断 ====================
        // 优先级与 extension 端 src/salary.ts 对齐：先 HOLIDAYS → false；再 WORKDAYS → true。
        // 这样如果同一日期意外同时出现在两个表，扩展与 WebView 行为一致（法定节假日优先）。
        function isWorkDay(date) {
            var ds = formatDate(date);
            if (config.holidays[ds]) return false;
            if (config.workdays[ds]) return true;
            var day = date.getDay();
            if (day === 0 || day === 6) return false;
            return true;
        }

        function getWorkHours() {
            var start = parseTime(config.startTime), end = parseTime(config.endTime);
            var lunch = config.lunchDurationMin;
            return (end - start - lunch) / 60;
        }

        function calculateMonthWorkDays(year, month) {
            var dim = new Date(year, month + 1, 0).getDate();
            if (config.mode === 'always') {
                return { days: dim, hours: dim * getWorkHours() };
            }
            var totalDays = 0, totalHours = 0;
            for (var d = 1; d <= dim; d++) {
                var date = new Date(year, month, d);
                if (isWorkDay(date)) { totalDays++; totalHours += getWorkHours(); }
            }
            return { days: totalDays, hours: totalHours };
        }

        // ==================== 月度缓存（O(1) 增量已赚金额）====================
        // _monthStats = {
        //   key: 'YYYY-MM',
        //   year, month,
        //   totalDays, totalHours,
        //   workHours, hourlyRate,
        //   dailyEarned,        // dailyRate = hourlyRate * workHours
        //   passedDaysEarned,   // 本月到「昨天」为止的累计
        //   lastTodayDate       // 跨日时增量更新 passedDaysEarned
        // }
        var _monthStats = null;
        var _lastMonthKey = null;
        var _lastSecondTick = -1;

        function getMonthKey(date) {
            return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
        }

        function invalidateMonthStats() { _monthStats = null; }

        function ensureMonthStats(now) {
            var key = getMonthKey(now);
            if (_monthStats && _monthStats.key === key) return _monthStats;

            var year = now.getFullYear();
            var month = now.getMonth();
            var result = calculateMonthWorkDays(year, month);
            var workHours = getWorkHours();
            var monthlySalary = config.monthlySalary;
            var hourlyRate = (monthlySalary > 0 && result.hours > 0 && workHours > 0)
                ? monthlySalary / result.hours
                : 0;

            // 缓存「今天」之前的累计（与 extension 端语义一致：today 之后另算）
            var today = now.getDate();
            var passedDaysEarned = 0;
            if (hourlyRate > 0 && config.mode === 'work') {
                for (var d = 1; d < today; d++) {
                    var date = new Date(year, month, d);
                    if (isWorkDay(date)) passedDaysEarned += hourlyRate * workHours;
                }
            }

            _monthStats = {
                key: key,
                year: year,
                month: month,
                totalDays: result.days,
                totalHours: result.hours,
                workHours: workHours,
                hourlyRate: hourlyRate,
                dailyEarned: (hourlyRate > 0 ? hourlyRate * workHours : 0),
                passedDaysEarned: passedDaysEarned,
                lastTodayDate: today
            };
            return _monthStats;
        }

        // O(1) 增量：仅算「今天」从上班起到 now 的累计；passedDaysEarned 走缓存
        function todayEarned(now) {
            var stats = ensureMonthStats(now);
            if (!stats || stats.hourlyRate <= 0) return 0;

            if (config.mode === 'always') {
                // 全天平摊：直接用真实毫秒差分摊，与 fix-backend 思想一致
                var dim = new Date(stats.year, stats.month + 1, 0).getDate();
                var totalSeconds = dim * 24 * 3600;
                var perSecond = config.monthlySalary / totalSeconds;
                var monthStart = new Date(stats.year, stats.month, 1).getTime();
                var elapsed = (now.getTime() - monthStart) / 1000;
                return perSecond * elapsed;
            }

            // work 模式：跨日则更新 passedDaysEarned
            var today = now.getDate();
            if (today !== stats.lastTodayDate) {
                var newPassed = 0;
                for (var d2 = 1; d2 < today; d2++) {
                    var dd = new Date(stats.year, stats.month, d2);
                    if (isWorkDay(dd)) newPassed += stats.hourlyRate * stats.workHours;
                }
                stats.passedDaysEarned = newPassed;
                stats.lastTodayDate = today;
            }

            var workStart = parseTime(config.startTime), workEnd = parseTime(config.endTime);
            var lunchStartMin = 0, lunchEndMin = 0;
            if (config.lunchDurationMin > 0) {
                lunchStartMin = parseTime(config.lunchStart);
                lunchEndMin = lunchStartMin + config.lunchDurationMin;
            }
            var currentTime = now.getHours() * 60 + now.getMinutes();
            var currentSec = now.getSeconds() + now.getMilliseconds() / 1000;
            var currentTotalMin = currentTime + currentSec / 60;

            var todayDate = new Date(stats.year, stats.month, today);
            var todayInc = 0;
            if (isWorkDay(todayDate)) {
                if (currentTotalMin >= workEnd) {
                    todayInc = stats.dailyEarned;
                } else if (currentTotalMin >= workStart) {
                    var workedMin = currentTotalMin - workStart;
                    if (lunchEndMin > lunchStartMin) {
                        if (currentTotalMin > lunchEndMin) workedMin -= (lunchEndMin - lunchStartMin);
                        else if (currentTotalMin > lunchStartMin) workedMin -= (currentTotalMin - lunchStartMin);
                    }
                    todayInc = stats.hourlyRate * (workedMin / 60);
                }
            }
            return stats.passedDaysEarned + todayInc;
        }

        // ==================== 倒计时 + 激励语 ====================
        var QUOTES = [
            "再睡一夏，上班在望 🛋️",
            "你的床在挽留你，但工资在呼唤你 💰",
            "距离财富自由还有...无数个工作日",
            "休息是为了更好地摸鱼 🐟",
            "每一秒的等待，都是为下一秒的工资做铺垫",
            "倒计时结束之时，就是你变富之日",
            "周末是上帝的，工资是你的 ⏰",
            "躺平是为了更好地站起",
            "今天休息得越好，明天赚钱越快",
            "你的时间很值钱，每一秒都在靠近下一个工作日",
            "不经历休息的无聊，怎体会赚钱的充实",
            "坚持住，下一个工作日正在赶来",
            "睡觉也是为上班充电 🔋",
            "醒来后，工资在向你招手 👋",
            "忍一时躺平，赚一世富贵",
            "休息时间越短，上班时间越美",
            "还在睡？你的同事已经开始卷了 👀",
            "假期是最好的投资，因为它会带来更多工资",
            "当前状态：等待上班，期待发财",
            "休息是假象，赚钱是真理"
        ];

        function isInWorkTime(now) {
            if (config.mode !== 'work') return true;
            if (!isWorkDay(now)) return false;
            var workStart = parseTime(config.startTime), workEnd = parseTime(config.endTime);
            var currentMin = now.getHours() * 60 + now.getMinutes();
            if (currentMin < workStart || currentMin >= workEnd) return false;
            // 午休区间不算"赚钱中"（与 fix-backend / extension 端 isWorkingTime 同步）
            if (config.lunchDurationMin > 0) {
                var lunchStartMin = parseTime(config.lunchStart);
                var lunchEndMin = lunchStartMin + config.lunchDurationMin;
                if (lunchEndMin > lunchStartMin && currentMin >= lunchStartMin && currentMin < lunchEndMin) return false;
            }
            return true;
        }

        function getNextWorkStart(fromDate) {
            var d = new Date(fromDate);
            var workStartMin = parseTime(config.startTime);
            var currentMin = d.getHours() * 60 + d.getMinutes();

            if (isWorkDay(d) && currentMin < workStartMin) {
                return new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(workStartMin / 60), workStartMin % 60, 0);
            }

            var next = new Date(d);
            next.setDate(next.getDate() + 1);
            next.setHours(0, 0, 0, 0);
            for (var i = 0; i < 60; i++) {
                if (isWorkDay(next)) {
                    return new Date(next.getFullYear(), next.getMonth(), next.getDate(), Math.floor(workStartMin / 60), workStartMin % 60, 0);
                }
                next.setDate(next.getDate() + 1);
            }
            return null;
        }

        function formatCountdown(ms) {
            if (ms <= 0) return "已经上班啦！🎉";
            var days = Math.floor(ms / 86400000);
            var hours = Math.floor((ms % 86400000) / 3600000);
            var mins = Math.floor((ms % 3600000) / 60000);
            var secs = Math.floor((ms % 60000) / 1000);
            if (days > 0) return days + '天 ' + String(hours).padStart(2, '0') + ':' + String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
            return String(hours).padStart(2, '0') + ':' + String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
        }

        function getQuote(now) {
            var idx = Math.floor(now.getTime() / 30000) % QUOTES.length;
            return QUOTES[idx];
        }

        // ==================== 动画循环 ====================
        var clockRunning = false;
        var lastClockValue = 0;
        var lastClockText = '';
        var lastClockOpacity = -1;
        var _displayMode = null; // 'countdown' | 'work' — 控制 .clock-display / #countdownBox 切换

        // 仅当字符串实际变化时才写入 textContent，避免每帧触发 reflow/repaint
        function setText(el, value) {
            if (el && el.textContent !== value) el.textContent = value;
        }
        function setClass(el, cls, on) {
            if (!el) return;
            if (on) { if (!el.classList.contains(cls)) el.classList.add(cls); }
            else { if (el.classList.contains(cls)) el.classList.remove(cls); }
        }
        function setDisplay(node, value) {
            if (!node || node.style.display === value) return;
            node.style.display = value;
        }

        function applyDisplayMode(mode) {
            if (_displayMode === mode) return;
            _displayMode = mode;
            var clockDisplay = document.querySelector('.clock-display');
            var countdownBox = document.getElementById('countdownBox');
            if (mode === 'countdown') {
                setDisplay(clockDisplay, 'none');
                setClass(countdownBox, 'hidden', false);
            } else {
                setDisplay(clockDisplay, '');
                setClass(countdownBox, 'hidden', true);
            }
        }

        function animateClock() {
            if (!clockRunning) return;
            requestAnimationFrame(animateClock);

            var now = new Date();
            var currentMonthKey = getMonthKey(now);

            // 跨月检测：跨月时刷新副指标（updateClockSub 走月度缓存）
            if (_lastMonthKey !== null && _lastMonthKey !== currentMonthKey) {
                updateClockSub();
            }
            _lastMonthKey = currentMonthKey;

            var inWork = isInWorkTime(now);

            if (!inWork && config.mode === 'work') {
                applyDisplayMode('countdown');
                // 1Hz 节流：非工作时段倒计时/激励语无需 60fps
                var sec = now.getSeconds();
                if (sec === _lastSecondTick) return;
                _lastSecondTick = sec;
                var nextStart = getNextWorkStart(now);
                setText(document.getElementById('countdownTime'), nextStart ? formatCountdown(nextStart - now) : "找不到下一个工作日 😅");
                setText(document.getElementById('countdownQuote'), getQuote(now));
                return;
            }

            // 工作时段 / always 模式：高频更新金额
            applyDisplayMode('work');
            var earned = todayEarned(now);
            var moneyStr = formatMoney(earned);
            var el = document.getElementById('clockAmount');
            if (lastClockText !== moneyStr) {
                el.textContent = moneyStr;
                lastClockText = moneyStr;
            }
            var opacity = earned > lastClockValue ? 1 : 0.95;
            if (opacity !== lastClockOpacity) {
                el.style.opacity = opacity;
                lastClockOpacity = opacity;
            }
            lastClockValue = earned;
        }

        function updateClockSub() {
            var monthlySalary = config.monthlySalary;
            var now = new Date();
            var stats = ensureMonthStats(now);
            var clockDaily = document.getElementById('clockDaily');
            var clockHourly = document.getElementById('clockHourly');
            var clockLeft = document.getElementById('clockLeft');
            var clockLeftLabel = document.getElementById('clockLeftLabel');

            if (monthlySalary && stats.hourlyRate > 0) {
                setText(clockDaily, formatMoneyShort(stats.hourlyRate * stats.workHours));
                setText(clockHourly, formatMoneyShort(stats.hourlyRate));
                var dim = new Date(stats.year, stats.month + 1, 0).getDate();
                if (config.mode === 'always') {
                    setText(clockLeftLabel, '本月剩余天数');
                    setText(clockLeft, String(dim - now.getDate() + 1));
                } else {
                    // 剩余工作日：仍然要扫剩余天数（依赖缓存的 year/month，省去重算整月）
                    var remaining = 0;
                    for (var d = now.getDate(); d <= dim; d++) {
                        var date = new Date(stats.year, stats.month, d);
                        if (isWorkDay(date)) remaining++;
                    }
                    setText(clockLeftLabel, '剩余工作日');
                    setText(clockLeft, String(remaining));
                }
            } else {
                setText(clockDaily, '-');
                setText(clockHourly, '-');
                setText(clockLeft, '-');
            }
        }

        // ==================== postMessage 监听 ====================
        window.addEventListener('message', function (event) {
            var msg = event.data;
            if (msg && msg.type === 'config') {
                if (msg.monthlySalary !== undefined) config.monthlySalary = msg.monthlySalary;
                if (msg.startTime) config.startTime = msg.startTime;
                if (msg.endTime) config.endTime = msg.endTime;
                if (msg.lunchDurationMin !== undefined) config.lunchDurationMin = msg.lunchDurationMin;
                if (msg.lunchStart) config.lunchStart = msg.lunchStart;
                if (msg.mode) config.mode = msg.mode;
                if (msg.theme) config.theme = msg.theme;
                if (msg.holidays) config.holidays = msg.holidays;
                if (msg.workdays) config.workdays = msg.workdays;
                if (msg.decimalPlaces !== undefined) {
                    config.decimalPlaces = resolveDp(msg.decimalPlaces);
                }
                applyTheme();
                // 任何配置变化都强制月度缓存重算（薪资/工时/节假日/调休变更都可能改变 hourlyRate 或工作日分布）
                invalidateMonthStats();
                updateClockSub();
            }
        });

        // ==================== 初始化 ====================
        applyTheme();
        clockRunning = true;
        updateClockSub();
        animateClock();

        // 通知扩展 webview 已就绪
        if (vscodeApi) {
            vscodeApi.postMessage({ type: 'ready' });
        }
    </script>
</body>
</html>
