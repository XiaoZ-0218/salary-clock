<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="哄我上班">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#101422">
    <link rel="manifest" href="site.webmanifest?v=20260421-edgefill">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png?v=20260421-edgefill">
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="img/apple-touch-icon.png?v=20260421-edgefill">
    <title>哄我上班 😽</title>
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=20260421-edgefill">
    <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png?v=20260421-edgefill">
    <link rel="icon" type="image/png" sizes="512x512" href="img/icon-512.png?v=20260421-edgefill">
    <link rel="stylesheet" href="css/style.css?v=20260421-edgefill">
</head>
<body class="theme-aurora">
    <div class="bg-decoration"></div>

    <!-- 设置页 -->
    <div id="setupView">
        <div class="setup-header">
            <h1>哄我上班 😽</h1>
            <p>设置完成后点击进入，看着你的时间变成钱</p>
        </div>

        <!-- 主题选择 -->
        <div class="theme-section">
            <div class="theme-label">🎨 选择主题</div>
            <div class="theme-grid" id="themeGrid"></div>
        </div>
        <button class="enter-btn" onclick="enterClock()">进入时钟 ⏵</button>

        <!-- 计算模式 -->
        <div class="card">
            <div class="card-title"><span>⚡</span><span>计算模式</span></div>
            <div class="time-grid" id="modeGrid"></div>
        </div>

        <!-- 月薪 -->
        <div class="card">
            <div class="card-title"><span>💵</span><span>月薪（税前）</span></div>
            <input type="number" class="salary-input" id="monthlySalary" placeholder="例如 20000" min="0">
        </div>

        <!-- 上班 -->
        <div class="card">
            <div class="card-title"><span>☕</span><span>上班时间</span></div>
            <div class="time-grid" id="startTimeGrid"></div>
        </div>

        <!-- 下班 -->
        <div class="card">
            <div class="card-title"><span>🌅</span><span>下班时间</span></div>
            <div class="time-grid" id="endTimeGrid"></div>
        </div>

        <!-- 午休 -->
        <div class="card">
            <div class="card-title"><span>🍱</span><span>午休时间</span></div>
            <div class="lunch-section">
                <div class="lunch-label">先选时长</div>
                <div class="lunch-options" id="lunchDurationRow"></div>
            </div>
            <div class="lunch-section">
                <div class="lunch-label">再选开始时间</div>
                <div class="lunch-options" id="lunchStartRow"></div>
            </div>
        </div>

        <!-- 日历 -->
        <div class="card">
            <div class="calendar-header">
                <div class="card-title" style="margin-bottom:0"><span>📅</span><span id="calendarMonth">2025年1月</span></div>
                <div class="calendar-nav">
                    <button class="btn-icon" onclick="changeMonth(-1)">◀</button>
                    <button class="btn-icon" onclick="changeMonth(1)">▶</button>
                </div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
            <div class="legend">
                <div class="legend-item"><div class="legend-dot legend-holiday"></div>法定节假日</div>
                <div class="legend-item"><div class="legend-dot legend-official"></div>法定调休</div>
                <div class="legend-item"><div class="legend-dot legend-company"></div>公司休假</div>
                <div class="legend-item"><div class="legend-dot legend-personal"></div>个人休假</div>
                <div class="legend-item"><div class="legend-dot legend-work"></div>手动上班</div>
                <div class="legend-item"><div class="legend-dot legend-workday"></div>工作日</div>
            </div>
            <div class="hint">💡 点击<strong>工作日</strong>选择休假，点击<strong>休息日</strong>标记"今天要上班😭"
            </div>
            <div class="month-stats">
                <span>🛋️ 本月休息天数：<b id="restDaysCount">-</b> 天</span>
            </div>
        </div>

        <button class="enter-btn" id="enterBtn" onclick="enterClock()">进入时钟 ⏵</button>
    </div>

    <!-- 时钟页 -->
    <div id="clockView" class="hidden">
        <div class="clock-effects" aria-hidden="true">
            <div class="effect effect-a"></div>
            <div class="effect effect-b"></div>
            <div class="effect effect-c"></div>
        </div>
        <div class="clock-display">
            <div class="clock-label">本月已赚</div>
            <div class="clock-amount" id="clockAmount">¥0.0000</div>
            <div class="clock-sub">
                <span>日薪 <b id="clockDaily">-</b></span>
                <span>时薪 <b id="clockHourly">-</b></span>
                <span><span id="clockLeftLabel">剩余工作日</span> <b id="clockLeft">-</b></span>
            </div>
        </div>
        <!-- 倒计时 + 激励语（非工作时段显示） -->
        <div class="countdown-box hidden" id="countdownBox">
            <div class="countdown-label">⏰ 距离上班还有</div>
            <div class="countdown-time" id="countdownTime">--天 --:--:--</div>
            <div class="countdown-quote" id="countdownQuote">...</div>
        </div>
        <button class="back-btn" onclick="backToSetup()">⚙️ 设置</button>
    </div>

    <!-- 模态框 -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-title" id="modalTitle">1月1日</div>
            <div class="modal-subtitle" id="modalSubtitle">选择当日状态</div>
            <div class="modal-options" id="modalOptions"></div>
            <button class="modal-close" onclick="closeModal()">取消</button>
        </div>
    </div>

    <script src="js/app.js?v=20260421-edgefill" defer></script>
</body>
</html>
